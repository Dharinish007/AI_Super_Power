<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ChatGPT Conversation Fixture</title>
</head>
<body>
  <header>
    <button data-testid="model-switcher-dropdown" aria-haspopup="menu">
      <span>GPT-4o</span>
    </button>
  </header>
  <main>
    <article data-testid="conversation-turn-1" data-message-author-role="user">
      <div class="whitespace-pre-wrap">How do service workers work in Manifest V3?</div>
    </article>
    <article data-testid="conversation-turn-2" data-message-author-role="assistant">
      <div class="markdown prose">
        <p>In Manifest V3, background scripts are replaced by ephemeral Service Workers.</p>
      </div>
    </article>
  </main>
  <form>
    <textarea id="prompt-textarea" placeholder="Ask anything"></textarea>
  </form>
</body>
</html>
