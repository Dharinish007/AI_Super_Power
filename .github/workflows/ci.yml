name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Includes the check that content/content-script.js is up to date with its sources
      - run: npm test
      - run: npm run validate
      - run: npm run pack
      - run: unzip -t dist/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: dist/*.zip
